version: 1
disable_existing_loggers: False

formatters:
  json:
    format: '%(asctime)s %(name)s %(levelname)s %(message)s'
    class: pythonjsonlogger.jsonlogger.JsonFormatter

handlers:
  console:
    class: logging.StreamHandler
    formatter: json
    level: INFO

  file:
    class: logging.handlers.RotatingFileHandler
    filename: /var/log/sen-parcelle/api.log
    maxBytes: 10485760
    backupCount: 7
    formatter: json
    level: INFO

loggers:
  django:
    handlers: [console, file]
    level: INFO
    propagate: False

  celery:
    handlers: [console, file]
    level: INFO
    propagate: False

  apps.blockchain:
    handlers: [console, file]
    level: INFO
    propagate: False

  apps.transactions:
    handlers: [console, file]
    level: INFO
    propagate: False

root:
  handlers: [console, file]
  level: WARNING
