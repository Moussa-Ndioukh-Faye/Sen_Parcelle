# ═══════════════════════════════════════════════════════════════
# docker-compose.yml — Production Stack Sen_parcelle
# ═══════════════════════════════════════════════════════════════

services:

  # ─── PostgreSQL + PostGIS ───
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: sen_db
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sen_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # ─── Redis ───
  redis:
    image: redis:7-alpine
    container_name: sen_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - sen_network
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'

  # ─── Django API (Gunicorn) ───
  backend:
    build:
      context:    ../../backend
      dockerfile: Dockerfile
      target:     production
    container_name: sen_backend
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput &&
        gunicorn config.wsgi:application \
          --bind 0.0.0.0:8000 \
          --workers ${GUNICORN_WORKERS:-4} \
          --worker-class gthread \
          --threads ${GUNICORN_THREADS:-2} \
          --timeout 120 \
          --keep-alive 5 \
          --access-logfile - \
          --error-logfile - \
          --log-level info
    env_file: .env.production
    volumes:
      - media_volume:/app/media
      - static_volume:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sen_network
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'

  # ─── Celery Worker ───
  celery_worker:
    build:
      context:    ../../backend
      dockerfile: Dockerfile
      target:     production
    container_name: sen_celery
    restart: unless-stopped
    command: >
      celery -A config.celery.app worker
        --loglevel=info
        --concurrency=${CELERY_CONCURRENCY:-4}
        --queues=blockchain,notifications,default
    env_file: .env.production
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - sen_network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'

  # ─── Celery Beat (tâches planifiées) ───
  celery_beat:
    build:
      context:    ../../backend
      dockerfile: Dockerfile
      target:     production
    container_name: sen_beat
    restart: unless-stopped
    command: >
      celery -A config.celery.app beat
        --loglevel=info
        --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env.production
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - sen_network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'

  # ─── Admin Angular (Nginx) ───
  web:
    build:
      context:    ../../web
      dockerfile: Dockerfile
      target:     production
    container_name: sen_web
    restart: unless-stopped
    networks:
      - sen_network
    expose:
      - "80"

  # ─── Nginx (Reverse Proxy) ───
  nginx:
    image: nginx:alpine
    container_name: sen_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
      - "${NGINX_HTTPS_PORT:-8443}:443"
    volumes:
      - ../../infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../infra/nginx/ssl:/etc/nginx/ssl:ro
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
    depends_on:
      - backend
      - web
    networks:
      - sen_network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.1'

volumes:
  postgres_data:
  redis_data:
  media_volume:
  static_volume:

networks:
  sen_network:
    driver: bridge
