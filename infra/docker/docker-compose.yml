# ═══════════════════════════════════════════════════════════════
# docker-compose.yml — Production Stack Sen_parcelle
# ═══════════════════════════════════════════════════════════════

version: '3.9'

services:

  # ─── PostgreSQL + PostGIS ───
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: sen_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sen_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─── Redis ───
  redis:
    image: redis:7-alpine
    container_name: sen_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - sen_network
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ─── Django API (Gunicorn) ───
  backend:
    build:
      context:    ../../backend
      dockerfile: Dockerfile
      target:     production
    container_name: sen_backend
    restart: unless-stopped
    command: >
      sh -c "
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput &&
        gunicorn config.wsgi:application
          --bind 0.0.0.0:8000
          --workers 4
          --worker-class gthread
          --threads 2
          --timeout 120
          --keep-alive 5
          --access-logfile -
          --error-logfile -
          --log-level info
      "
    env_file: .env.production
    volumes:
      - media_volume:/app/media
      - static_volume:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sen_network
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Celery Worker ───
  celery_worker:
    build:
      context:    ../../backend
      dockerfile: Dockerfile
      target:     production
    container_name: sen_celery
    restart: unless-stopped
    command: >
      celery -A config.celery.app worker
        --loglevel=info
        --concurrency=4
        --queues=blockchain,notifications,default
    env_file: .env.production
    depends_on:
      - backend
      - redis
    networks:
      - sen_network

  # ─── Celery Beat (tâches planifiées) ───
  celery_beat:
    build:
      context:    ../../backend
      dockerfile: Dockerfile
      target:     production
    container_name: sen_beat
    restart: unless-stopped
    command: >
      celery -A config.celery.app beat
        --loglevel=info
        --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env.production
    depends_on:
      - backend
      - redis
    networks:
      - sen_network

  # ─── Nginx (Reverse Proxy) ───
  nginx:
    image: nginx:alpine
    container_name: sen_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
      - ./web/dist:/var/www/angular:ro
    depends_on:
      - backend
    networks:
      - sen_network

volumes:
  postgres_data:
  redis_data:
  media_volume:
  static_volume:

networks:
  sen_network:
    driver: bridge
