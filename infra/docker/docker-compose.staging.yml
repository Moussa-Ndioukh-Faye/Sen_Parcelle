services:
  db:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: sen_parcelle_staging
      POSTGRES_USER: sen_parcelle
      POSTGRES_PASSWORD: change-me
    volumes:
      - postgis_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sen_parcelle -d sen_parcelle_staging"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - staging

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_staging_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - staging

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      DJANGO_ENV: staging
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CORS_ORIGINS: ${CORS_ORIGINS}
      REDIS_URL: redis://redis:6379/1
      DB_NAME: sen_parcelle_staging
      DB_USER: sen_parcelle
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      SENTRY_DSN: ${SENTRY_DSN}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - backend_media:/app/media
      - backend_static:/app/staticfiles
    networks:
      - staging

  celery_worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: celery -A config worker -l info -Q blockchain,notifications,default -c 2
    environment:
      DJANGO_ENV: staging
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      REDIS_URL: redis://redis:6379/1
      DB_NAME: sen_parcelle_staging
      DB_USER: sen_parcelle
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      CELERY_TASK_ALWAYS_EAGER: "false"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks:
      - staging

  nginx:
    image: nginx:alpine
    volumes:
      - ../infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - backend_media:/var/www/media:ro
      - backend_static:/var/www/static:ro
      - ../web/dist/sen-parcelle-admin:/var/www/admin:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - staging

volumes:
  postgis_staging_data:
  redis_staging_data:
  backend_media:
  backend_static:

networks:
  staging:
    driver: bridge
