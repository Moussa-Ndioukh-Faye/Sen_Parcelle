apiVersion: apps/v1
kind: Deployment
metadata:
  name: sen-parcelle-backend
  namespace: sen-parcelle
  labels:
    app: sen-parcelle
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sen-parcelle
      tier: backend
  template:
    metadata:
      labels:
        app: sen-parcelle
        tier: backend
    spec:
      containers:
        - name: api
          image: sen-parcelle/backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: sen-parcelle-secrets
            - configMapRef:
                name: sen-parcelle-config
          livenessProbe:
            httpGet:
              path: /api/health/
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health/
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sen-parcelle-celery-worker
  namespace: sen-parcelle
  labels:
    app: sen-parcelle
    tier: celery
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sen-parcelle
      tier: celery
  template:
    metadata:
      labels:
        app: sen-parcelle
        tier: celery
    spec:
      containers:
        - name: worker
          image: sen-parcelle/backend:latest
          command: ["celery", "-A", "config", "worker", "-l", "info", "-Q", "blockchain,notifications,default"]
          envFrom:
            - secretRef:
                name: sen-parcelle-secrets
            - configMapRef:
                name: sen-parcelle-config
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sen-parcelle-frontend
  namespace: sen-parcelle
  labels:
    app: sen-parcelle
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sen-parcelle
      tier: frontend
  template:
    metadata:
      labels:
        app: sen-parcelle
        tier: frontend
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: static
              mountPath: /var/www/static
            - name: media
              mountPath: /var/www/media
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: nginx-config
        - name: static
          emptyDir: {}
        - name: media
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sen-parcelle-backend-svc
  namespace: sen-parcelle
spec:
  selector:
    app: sen-parcelle
    tier: backend
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: sen-parcelle-frontend-svc
  namespace: sen-parcelle
spec:
  selector:
    app: sen-parcelle
    tier: frontend
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sen-parcelle-ingress
  namespace: sen-parcelle
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit-rps: "30"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.sen-parcelle.sn
        - admin.sen-parcelle.sn
      secretName: sen-parcelle-tls
  rules:
    - host: api.sen-parcelle.sn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sen-parcelle-backend-svc
                port:
                  number: 8000
    - host: admin.sen-parcelle.sn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sen-parcelle-frontend-svc
                port:
                  number: 80
