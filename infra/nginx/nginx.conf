# ═════════════════════════════════════════════════════════════
# nginx.conf — Reverse Proxy for Sen_parcelle
# ═════════════════════════════════════════════════════════════
# Serveur unique :
#   - /api/* → backend Django (Gunicorn)
#   - /static/*, /media/* → fichiers statiques
#   - /* → admin Angular (SPA)
# ═════════════════════════════════════════════════════════════

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Compression
    gzip          on;
    gzip_types    text/plain application/json application/javascript text/css
                  application/xml image/svg+xml;
    gzip_min_length 1000;

    # ─── Real IP (Docker / proxy) ───
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  10.0.0.0/8;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # ─── Rate limiting ───
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

    # ─── HTTP → HTTPS ───
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ─── HTTPS (API + Admin Angular) ───
    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/sen-parcelle-dev.crt;
        ssl_certificate_key /etc/nginx/ssl/sen-parcelle-dev.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        client_max_body_size 50M;

        # Security headers
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header X-XSS-Protection          "1; mode=block" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none';" always;

        # ─── API ───

        # Auth (rate limit strict)
        location /api/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass         http://backend:8000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # API (rate limit général)
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass         http://backend:8000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # Webhooks (pas de rate limit)
        location /api/transactions/webhook/ {
            proxy_pass         http://backend:8000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ─── Angular font files (Material Icons self-hosted) ───
        location ~ ^/media/material-icons {
            proxy_pass http://web:80;
            expires 30d;
        }

        # ─── Fichiers statiques Django ───
        location /static/ { alias /var/www/static/; expires 30d; }
        location /media/  { alias /var/www/media/;  expires 7d;  }

        # ─── Admin Angular (SPA — proxy vers web:80) ───
        location / {
            proxy_pass         http://web:80;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
