# ═════════════════════════════════════════════════════════════
# nginx.conf — Reverse Proxy for Sen_parcelle
# ═════════════════════════════════════════════════════════════

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Compression
    gzip          on;
    gzip_types    text/plain application/json application/javascript text/css
                  application/xml image/svg+xml;
    gzip_min_length 1000;

    # ─── Rate limiting ───
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

    # ─── HTTP → HTTPS (décommenter en production) ───
    server {
        listen 80;
        server_name sen-parcelle.sn api.sen-parcelle.sn admin.sen-parcelle.sn;
        return 301 https://$host$request_uri;
    }

    # ─── HTTPS Backend API ───
    server {
        listen 443 ssl http2;
        server_name api.sen-parcelle.sn;

        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        client_max_body_size 50M;

        # API (rate limit général)
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass         http://backend:8000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # Auth (rate limit strict — AVANT /api/ pour priorité)
        location /api/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://backend:8000;
        }

        # Webhooks (pas de rate limit — providers fiables)
        location /api/transactions/webhook/ {
            proxy_pass http://backend:8000;
            proxy_read_timeout 30s;
        }

        location /static/ { alias /var/www/static/; expires 30d; }
        location /media/  { alias /var/www/media/;  expires 7d;  }
    }

    # ─── HTTPS Admin Angular ───
    server {
        listen 443 ssl http2;
        server_name admin.sen-parcelle.sn;

        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        root  /var/www/angular;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
