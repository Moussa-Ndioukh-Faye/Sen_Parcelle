name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SECRET_KEY: ci-secret-key-not-for-production
  ALLOWED_HOSTS: localhost
  CORS_ALLOWED_ORIGINS: http://localhost:4200
  REDIS_URL: redis://localhost:6379/0
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"
  FLUTTER_VERSION: "3.32.0"

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install poetry
        run: pipx install poetry

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry
          cache-dependency-path: backend/poetry.lock

      - name: Install dependencies
        run: |
          cd backend
          poetry install

      - name: Lint with ruff
        run: |
          cd backend
          poetry run ruff check .

      - name: Check formatting with ruff
        run: |
          cd backend
          poetry run ruff format --check .

      - name: Run tests with coverage
        run: |
          cd backend
          poetry run pytest --cov --cov-fail-under=80 --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          file: backend/coverage.xml
          flags: backend
          name: backend-coverage

  web:
    name: Web Admin (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --watch=false --browsers=ChromeHeadless --code-coverage

      - name: Build (production)
        run: npm run build

  blockchain:
    name: Blockchain (Hardhat)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blockchain

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: blockchain/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npm run compile

      - name: Run tests
        run: npm test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.single
      SQLITE_PATH: /tmp/e2e.sqlite3
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      DEBUG: "0"
      # Compte admin de test, créé uniquement dans cette base éphémère
      E2E_ADMIN_EMAIL: admin@e2e.sn
      E2E_ADMIN_PASSWORD: Admin#E2e2026

    steps:
      - uses: actions/checkout@v4

      - name: Install poetry
        run: pipx install poetry

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry
          cache-dependency-path: backend/poetry.lock

      - name: Démarrer l'API Django
        working-directory: backend
        run: |
          poetry install
          poetry run python manage.py migrate --noinput
          poetry run python manage.py shell -c "
          import os
          from apps.users.infrastructure.models import User
          User.objects.create_superuser(os.environ['E2E_ADMIN_EMAIL'], '+221770009999', os.environ['E2E_ADMIN_PASSWORD'], nom='Admin E2E', kyc_status='verified')
          "
          nohup poetry run python manage.py runserver 8000 > /tmp/django.log 2>&1 &

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json

      - name: Démarrer l'interface Angular
        working-directory: web
        run: |
          npm ci
          nohup npx ng serve --port 4200 --proxy-config proxy.conf.json > /tmp/ng.log 2>&1 &
          npx --yes wait-on --timeout 240000 http-get://localhost:4200 http-get://localhost:8000/api/health/

      - name: Install dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: e2e
        run: npm run test:e2e

      - name: Journaux des serveurs
        if: failure()
        run: tail -n 100 /tmp/django.log /tmp/ng.log

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/

  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          file: mobile/coverage/lcov.info
          flags: mobile
          name: mobile-coverage

  deploy:
    name: Deploy (Docker)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend, web, blockchain, mobile, e2e]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          target: production
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/sen-parcelle-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/sen-parcelle-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/sen-parcelle
            docker compose -f infra/docker/docker-compose.yml pull
            docker compose -f infra/docker/docker-compose.yml up -d --remove-orphans
            docker image prune -f
