[build-system]
requires = ["poetry-core>=1.9"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "sen-parcelle-backend"
version = "1.0.0"
description = "Plateforme foncière sécurisée — Sénégal"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
django = "^5.0"
djangorestframework = "^3.15"
djangorestframework-simplejwt = "^5.3"
django-cors-headers = "^4.3"
django-filter = "^23.5"
django-ratelimit = "^4.1"
django-redis = "^5.4"
django-storages = "^1.14"
psycopg2-binary = "^2.9"
celery = "^5.3"
django-celery-beat = "^2.6"
drf-spectacular = "^0.27"
django-health-check = "^3.18"
redis = "^5.0"
boto3 = "^1.34"
web3 = "^6.15"
Pillow = "^10.2"
twilio = "^8.12"
requests = "^2.31"
gunicorn = "^21.2"
whitenoise = "^6.6"
sentry-sdk = "^2.20"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-django = "^4.8"
pytest-cov = "^4.1"
factory-boy = "^3.3"
faker = "^23.2"
ruff = "^0.9.0"
pre-commit = "^4.0"
model-bakery = "^1.19"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["migrations", "snapshots"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "SIM", "PT", "RUF"]
ignore = [
    "SIM117",     # nested `with` statements
    "RUF012",     # mutable class attrs (Django models style)
    "N818",       # Exception naming suffix (DomainException existing)
    "N803",       # argument name casing (test mocks)
    "N806",       # variable casing (existing code)
    "E741",       # ambiguous variable `l`
    "E702",       # multiple statements on one line
    "PT011",      # pytest.raises too broad
    "E402",       # module-level import not at top (lazy imports)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.coverage.run]
source = ["."]
omit = ["*/migrations/*", "*/tests/*", "config/settings/*", "*/manage.py"]
