name: sen_parcelle
description: Plateforme foncière sécurisée — Sénégal
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ─── State management ───
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ─── Navigation ───
  go_router: ^13.2.0

  # ─── HTTP + API ───
  dio: ^5.4.3
  pretty_dio_logger: ^1.3.1

  # ─── Stockage local sécurisé ───
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3

  # ─── UI / Design ───
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  fl_chart: ^0.67.0

  # ─── Carte / GPS ───
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^11.0.0

  # ─── Upload fichiers ───
  image_picker: ^1.1.2
  file_picker: ^8.0.3
  permission_handler: ^11.3.1

  # ─── Utilitaires ───
  intl: ^0.19.0
  timeago: ^3.6.1
  url_launcher: ^6.3.0
  connectivity_plus: ^6.0.3
  local_auth: ^2.2.0       # Biométrie (empreinte)
  crypto: ^3.0.3           # SHA-256 côté Flutter

  # ─── Notifications ───
  firebase_core: ^3.2.0
  firebase_messaging: ^15.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  mockito: ^5.4.4
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
